name: Deploy backend to ECS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'デプロイするブランチを選択してください'
        type: string
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      
      - name: Output branch information
        run: |
          echo "=== Branch Information ==="
          echo "Current branch (github.ref_name): ${{ github.ref_name }}"
          echo "Input branch (workflow_dispatch): ${{ github.event.inputs.branch }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Full ref: ${{ github.ref }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual deployment - Using input branch: ${{ github.event.inputs.branch }}"
          else
            echo "Push triggered deployment - Using pushed branch: ${{ github.ref_name }}"
          fi
      
      - name: List repository root directory
        run: |
          echo "=== Repository Root Directory Contents ==="
          ls -la
          echo ""
          echo "=== Current working directory ==="
          pwd
          echo ""
          echo "=== Git branch information ==="
          git branch -a
          git log --oneline -5
